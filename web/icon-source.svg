<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source for the PWA icons (web/public/icons) and favicon. Full-bleed background so it works as a maskable
       icon; the tag stays inside the central safe zone. Rendered with Chrome headless, scaled with Pillow. -->
  <rect width="512" height="512" fill="#0a2d6e"/>
  <g transform="rotate(-12 256 256)">
    <!-- Shelf price label: yellow tag, white edge stripe like the store colour on the app's offer badges. -->
    <rect x="118" y="168" width="276" height="176" rx="22" fill="#ffe45c"/>
    <rect x="118" y="168" width="26" height="176" rx="10" fill="#ffffff"/>
    <rect x="132" y="168" width="14" height="176" fill="#ffffff"/>
    <!-- Tick: the list item bought. -->
    <path d="M196 262 L240 304 L330 212" fill="none" stroke="#0a2d6e" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
